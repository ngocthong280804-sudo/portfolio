name: PDF export smoke check

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pdf-export-smoke.yml'

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write smoke marker
        run: |
          mkdir -p exports
          date -u +'%Y-%m-%dT%H:%M:%SZ' > exports/pdf-export-smoke.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exports/pdf-export-smoke.txt
          git commit -m 'Confirm PDF export workflow' || exit 0
          git push
