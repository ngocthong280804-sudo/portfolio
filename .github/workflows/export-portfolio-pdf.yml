name: Export exact portfolio PDF

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/export-portfolio-pdf.yml'
      - 'scripts/export-portfolio-pdf.mjs'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact current portfolio
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install lightweight browser controller
        run: |
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core@24.16.0
          command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser

      - name: Start portfolio locally
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/portfolio-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/portfolio-http.log
          exit 1

      - name: Render exact website and all project cases
        run: |
          set +e
          node scripts/export-portfolio-pdf.mjs 2>&1 | tee portfolio-pdf-export.log
          echo "${PIPESTATUS[0]}" > portfolio-pdf-export.exit
          exit 0

      - name: Persist PDF and export diagnostics
        run: |
          mkdir -p exports
          cp portfolio-pdf-export.log exports/portfolio-pdf-export.log
          cp portfolio-pdf-export.exit exports/portfolio-pdf-export.exit
          if [ -f portfolio-pdf-export-report.json ]; then
            cp portfolio-pdf-export-report.json exports/portfolio-pdf-export-report.json
          fi
          if [ -f Tran-Ngoc-Thong-Portfolio-GitHub.pdf ]; then
            cp Tran-Ngoc-Thong-Portfolio-GitHub.pdf exports/Tran-Ngoc-Thong-Portfolio-GitHub.pdf
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exports/
          git commit -m 'Generate exact portfolio PDF' || true
          git push

          test "$(cat portfolio-pdf-export.exit)" = "0"
          test -f Tran-Ngoc-Thong-Portfolio-GitHub.pdf

      - name: Upload downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tran-Ngoc-Thong-Portfolio-GitHub
          path: Tran-Ngoc-Thong-Portfolio-GitHub.pdf
          if-no-files-found: error
          retention-days: 7
