name: Export exact portfolio PDF

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/export-portfolio-pdf.yml'
      - 'scripts/export-portfolio-pdf.mjs'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact current portfolio
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start portfolio locally
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/portfolio-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/portfolio-http.log
          exit 1

      - name: Render exact website and all project cases to one PDF
        run: node scripts/export-portfolio-pdf.mjs

      - name: Save generated PDF in repository
        run: |
          mkdir -p exports
          cp Tran-Ngoc-Thong-Portfolio-GitHub.pdf exports/Tran-Ngoc-Thong-Portfolio-GitHub.pdf
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exports/Tran-Ngoc-Thong-Portfolio-GitHub.pdf
          git commit -m 'Generate exact portfolio PDF' || exit 0
          git push

      - name: Upload downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tran-Ngoc-Thong-Portfolio-GitHub
          path: Tran-Ngoc-Thong-Portfolio-GitHub.pdf
          if-no-files-found: error
          retention-days: 7
